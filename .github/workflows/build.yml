name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android files safely
        run: |
          cp lib/main.dart main.dart.bak
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --platforms=android --project-name=tap_counter .
          mv main.dart.bak lib/main.dart
          mv pubspec.yaml.bak pubspec.yaml
          sed -i 's/android:label="tap_counter"/android:label="Tap Counter"/g' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: Tap-Counter-APK
          path: build/app/outputs/flutter-apk/app-release.apk
